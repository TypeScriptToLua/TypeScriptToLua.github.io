version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "typescript-to-lua"
      - dependency-name: "lua-types"
      - dependency-name: "typescript"
    groups:
      typescript-to-lua:
        patterns:
          - "typescript-to-lua"
          - "typescript"
