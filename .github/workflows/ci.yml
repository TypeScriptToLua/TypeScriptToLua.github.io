name: CI

on: [push, pull_request]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 22
        uses: actions/setup-node@v1
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run lint
